name: Maven Test

on:
  # Run tests on PRs to verify code doesn't break before merge
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - '**/*.java'
      - pom.xml
      - '!.github/workflows/**'
  # Run tests after merge and collect coverage as canonical source of truth
  push:
    branches: [master]
    paths:
      - '**/*.java'
      - pom.xml
  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel older runs when new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn -B test

      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        run: >
          mvn -B
          org.jacoco:jacoco-maven-plugin:prepare-agent
          test
          org.jacoco:jacoco-maven-plugin:report

      - name: Convert JaCoCo to lcov
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p coverage
          # Install pycobertura-like tool to convert; use a simple Python approach
          pip install lcov_cobertura 2>/dev/null || true
          # Use jacoco csv/xml to produce lcov
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          report_path = 'target/site/jacoco/jacoco.xml'
          if not os.path.exists(report_path):
              print('JaCoCo XML report not found, skipping lcov conversion')
              exit(0)

          tree = ET.parse(report_path)
          root = tree.getroot()
          lcov_lines = []

          for package in root.findall('.//package'):
              pkg_name = package.get('name', '')
              for sourcefile in package.findall('sourcefile'):
                  sf_name = sourcefile.get('name', '')
                  source_path = pkg_name + '/' + sf_name
                  lcov_lines.append('TN:')
                  lcov_lines.append('SF:src/main/java/' + source_path)
                  for line in sourcefile.findall('line'):
                      nr = line.get('nr')
                      ci = int(line.get('ci', 0))
                      mi = int(line.get('mi', 0))
                      hits = 1 if ci > 0 else 0
                      lcov_lines.append(f'DA:{nr},{hits}')
                  lcov_lines.append('end_of_record')

          with open('coverage/lcov.info', 'w') as f:
              f.write('\n'.join(lcov_lines) + '\n')
          print('Generated coverage/lcov.info')
          "

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
