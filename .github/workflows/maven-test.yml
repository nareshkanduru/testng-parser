name: Maven Test

on:
  # Run tests on PRs to verify code doesn't break before merge
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - '**/*.java'
      - pom.xml
      - '!.github/workflows/**'
  # Run tests after merge and collect coverage as canonical source of truth
  push:
    branches: [master]
    paths:
      - '**/*.java'
      - pom.xml
  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel older runs when new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run tests (PR only)
        if: github.event_name == 'pull_request'
        run: mvn -B test

      - name: Run tests with coverage (push/dispatch)
        if: github.event_name != 'pull_request'
        run: mvn -B test org.jacoco:jacoco-maven-plugin:prepare-agent org.jacoco:jacoco-maven-plugin:report

      - name: Convert JaCoCo XML to LCOV
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install lcov_cobertura
          # JaCoCo generates XML report at target/site/jacoco/jacoco.xml
          # First convert jacoco.xml to cobertura format, then to lcov
          # Use a simpler approach: generate lcov directly from jacoco csv/xml
          mkdir -p coverage
          # Install a tool to convert jacoco to lcov
          pip3 install pycobertura
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          jacoco_xml = 'target/site/jacoco/jacoco.xml'
          if not os.path.exists(jacoco_xml):
              print('JaCoCo XML report not found')
              exit(1)

          tree = ET.parse(jacoco_xml)
          root = tree.getroot()

          lcov_lines = []
          for package in root.findall('.//package'):
              pkg_name = package.get('name', '')
              for sourcefile in package.findall('sourcefile'):
                  sf_name = sourcefile.get('name', '')
                  source_path = pkg_name + '/' + sf_name
                  lcov_lines.append('TN:')
                  lcov_lines.append('SF:' + source_path)
                  for line in sourcefile.findall('line'):
                      line_nr = line.get('nr')
                      mi = int(line.get('mi', 0))
                      ci = int(line.get('ci', 0))
                      hits = ci
                      lcov_lines.append('DA:' + line_nr + ',' + str(hits))
                  # Summary
                  lines = sourcefile.findall('line')
                  lcov_lines.append('LF:' + str(len(lines)))
                  hit_count = sum(1 for l in lines if int(l.get('ci', 0)) > 0)
                  lcov_lines.append('LH:' + str(hit_count))
                  lcov_lines.append('end_of_record')

          with open('coverage/lcov.info', 'w') as f:
              f.write('\n'.join(lcov_lines) + '\n')
          print('LCOV report generated at coverage/lcov.info')
          "

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
